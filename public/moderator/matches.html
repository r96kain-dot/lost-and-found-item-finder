<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No tab icon yet; this stops the browser asking for favicon.ico. -->
    <link rel="icon" href="data:," />
    <title>Potential Matches · Lost &amp; Found Item Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../style.css" />
    <script src="../app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__start">
          <a class="brand" href="matches.html">
            <span class="brand__logo" aria-hidden="true">LF</span>
            <span class="brand__name">Lost &amp; Found Item Finder</span>
          </a>
          <span class="site-header__badge">Moderator</span>
        </div>
        <div class="site-header__end">
          <nav class="site-nav" aria-label="Moderator">
            <a class="site-nav__link" href="matches.html" aria-current="page"
              >Potential Matches</a
            >
          </nav>
          <!-- Logs the Moderator out and ends the session (app.js). -->
          <a
            class="button button--on-primary"
            href="login.html"
            data-moderator-logout
            ><svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5M21 12H9" /></svg
            >Log out</a
          >
          <!-- Initials and email are filled in from the login session. -->
          <span class="avatar"
            ><span aria-hidden="true">--</span
            ><span class="visually-hidden">Signed-in moderator</span></span
          >
        </div>
      </div>
    </header>

    <main class="page page--moderator">
      <h1 class="mod-heading">Potential Matches</h1>

      <!-- Counted from the matches the backend sends (app.js). -->
      <ul class="stat-cards" role="list">
        <li class="card stat-card stat-card--amber">
          <span class="stat-card__number" id="stat-awaiting">0</span>Awaiting
          review
        </li>
        <li class="card stat-card stat-card--lost">
          <span class="stat-card__number" id="stat-late">0</span>Waiting over 3
          days
        </li>
        <li class="card stat-card stat-card--primary">
          <span class="stat-card__number" id="stat-approved">0</span>Approved
        </li>
        <li class="card stat-card stat-card--found">
          <span class="stat-card__number" id="stat-collected">0</span>Collected
        </li>
      </ul>

      <div class="match-toolbar">
        <div class="search">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-4-4" />
          </svg>
          <label class="visually-hidden" for="match-search"
            >Search a reference number</label
          >
          <input
            class="input"
            id="match-search"
            type="search"
            placeholder="Search a reference number"
          />
        </div>
        <div class="status-filter">
          <label for="match-status">Status</label>
          <select class="select" id="match-status">
            <option value="all">All</option>
            <option value="needs-review">Needs review</option>
            <option value="approved">Approved</option>
            <option value="collected">Collected</option>
            <option value="not-a-match">Not a match</option>
          </select>
        </div>
      </div>

      <!-- Rows are built from the backend's matches (app.js). -->
      <div class="table-wrap">
        <table class="table matches-table" id="matches-table">
          <thead>
            <tr>
              <th scope="col">Lost Report</th>
              <th scope="col">Found Report</th>
              <th scope="col">Match</th>
              <th scope="col" aria-sort="descending">
                Waiting <span aria-hidden="true">↓</span>
              </th>
              <th scope="col">Status</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Also used for "loading", "none yet" and "couldn't load". -->
            <tr id="matches-empty">
              <td class="matches-empty" colspan="6">Loading matches…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
