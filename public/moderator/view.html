<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No tab icon yet; this stops the browser asking for favicon.ico. -->
    <link rel="icon" href="data:," />
    <title>View Match · Lost &amp; Found Item Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../style.css" />
    <script src="../app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__start">
          <a class="brand" href="matches.html">
            <span class="brand__logo" aria-hidden="true">LF</span>
            <span class="brand__name">Lost &amp; Found Item Finder</span>
          </a>
          <span class="site-header__badge">Moderator</span>
        </div>
        <div class="site-header__end">
          <nav class="site-nav" aria-label="Moderator">
            <a class="site-nav__link" href="matches.html">Potential Matches</a>
          </nav>
          <!-- Logs the Moderator out and ends the session (app.js). -->
          <a
            class="button button--on-primary"
            href="login.html"
            data-moderator-logout
            ><svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5M21 12H9" /></svg
            >Log out</a
          >
          <!-- Initials and email are filled in from the login session. -->
          <span class="avatar"
            ><span aria-hidden="true">--</span
            ><span class="visually-hidden">Signed-in moderator</span></span
          >
        </div>
      </div>
    </header>

    <!-- Filled in by app.js from the match chosen on Potential Matches (?match=ID). -->
    <main class="page page--moderator">
      <a class="back-link" href="matches.html"
        ><svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10 3L5 8l5 5" /></svg
        >Potential Matches</a
      >
      <div class="mod-heading mod-heading__title">
        <h1 id="view-title">Match</h1>
        <span class="badge badge--status" id="view-status" hidden></span>
      </div>

      <!-- Where the match is up to, with the next step (Review or Verify
           claimant). Also shows errors. -->
      <div class="banner" id="view-banner" role="status" hidden>
        <svg
          class="banner__icon"
          id="view-banner-icon"
          width="32"
          height="32"
          viewBox="0 0 32 32"
          aria-hidden="true"
          hidden
        >
          <circle cx="16" cy="16" r="16" fill="currentColor" />
          <path
            d="M9.5 16.5l4.5 4.5 8.5-10"
            fill="none"
            stroke="#fff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <p class="banner__text" id="view-banner-text"></p>
        <a
          class="button button--primary button--small"
          id="view-link"
          href="matches.html"
          hidden
        ></a>
      </div>

      <div class="report-pair" id="view-pair"></div>

      <!-- Built from the match's dates for now. The full Activity Log needs a
           backend route (asked Richard). -->
      <section class="activity" aria-labelledby="activity-title" hidden>
        <h2 id="activity-title">Activity on this match</h2>
        <div class="table-wrap">
          <table class="table activity-table">
            <thead>
              <tr>
                <th scope="col">When</th>
                <th scope="col">Event</th>
                <th scope="col">Recorded by</th>
                <th scope="col">Detail</th>
              </tr>
            </thead>
            <tbody id="activity-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
